    <linearGradient id="tileCoral" x1="250" y1="548" x2="507" y2="671" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF9C91"/><stop offset="1" stop-color="#F16D91"/>
    </linearGradient>
    <linearGradient id="tileAmber" x1="518" y1="548" x2="776" y2="671" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFD478"/><stop offset="1" stop-color="#F6A950"/>
