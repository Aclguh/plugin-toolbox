      <path d="M203 405c0-19 15-34 34-34h550c19 0 34 15 34 34v17H203v-17Z" fill="#FFFFFF" fill-opacity=".66"/>
      <rect x="222" y="407" width="580" height="293" rx="48" fill="#1B2445"/>
      <rect x="229" y="414" width="566" height="279" rx="41" fill="#222D50"/>

