      <rect x="518" y="560" width="256" height="116" rx="28" fill="none" stroke="#FFF2D0" stroke-opacity=".48" stroke-width="2"/>

      <!-- A clean plus marks an add-on; the adjacent plug identifies the system. -->
      <path d="M378 455v66M345 488h66" fill="none" stroke="#F7FFFE" stroke-width="18" stroke-linecap="round"/>
      <path d="M620 473v-22M662 473v-22" fill="none" stroke="#F7FBFF" stroke-width="14" stroke-linecap="round"/>
