      <path d="M696 579c2 8 7 13 15 15-8 2-13 7-15 15-2-8-7-13-15-15 8-2 13-7 15-15Z" fill="#FFFEF8" fill-opacity=".88"/>

      <path d="M206 725h612" stroke="#AABDE1" stroke-opacity=".66" stroke-width="4"/>
      <rect x="442" y="724" width="140" height="58" rx="20" fill="url(#latch)"/>
      <rect x="462" y="739" width="100" height="8" rx="4" fill="#EAF0FF" fill-opacity=".8"/>
      <rect x="493" y="755" width="38" height="7" rx="3.5" fill="#D2DCFF" fill-opacity=".64"/>
      <path d="M204 794h18M802 794h18" stroke="#A6B7DE" stroke-opacity=".68" stroke-width="5" stroke-linecap="round"/>
