      <path d="M326 590h104M326 618h104M326 646h104" fill="none" stroke="#FFF9FC" stroke-opacity=".96" stroke-width="10" stroke-linecap="round"/>
      <circle cx="355" cy="590" r="10" fill="#F47D91"/>
      <circle cx="397" cy="618" r="10" fill="#F47D91"/>
      <circle cx="370" cy="646" r="10" fill="#F47D91"/>
