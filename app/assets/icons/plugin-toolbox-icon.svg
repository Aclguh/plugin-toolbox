<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="100" y1="40" x2="930" y2="990" gradientUnits="userSpaceOnUse">
