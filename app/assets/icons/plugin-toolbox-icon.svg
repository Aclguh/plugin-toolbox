    <circle cx="512" cy="512" r="385" fill="none" stroke="#B4C9FF" stroke-opacity=".045" stroke-width="2"/>
    <circle cx="512" cy="512" r="326" fill="none" stroke="#B4C9FF" stroke-opacity=".035" stroke-width="2"/>

