      <path d="M409 365V279c0-34 27-61 61-61h84c34 0 61 27 61 61v86" fill="none" stroke="#111A39" stroke-opacity=".72" stroke-width="86" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M409 365V279c0-34 27-61 61-61h84c34 0 61 27 61 61v86" fill="none" stroke="url(#handle)" stroke-width="62" stroke-linecap="round" stroke-linejoin="round"/>
