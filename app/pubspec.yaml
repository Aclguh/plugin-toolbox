name: plugin_toolbox
description: 万物皆插件——以插件为核心架构的 Android 工具箱。
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter

  # 内部包
  plugin_toolbox_core:
    path: ../packages/core
  plugin_toolbox_lua:
    path: ../packages/lua
  plugin_toolbox_dui:
    path: ../packages/dui
  plugin_toolbox_ui:
    path: ../packages/ui

  # 状态管理 & 路由
  flutter_riverpod: ^2.6.0
  riverpod_annotation: ^2.6.0
  go_router: ^14.0.0

  # 文件选择与动态取色
  file_picker: ^8.1.4
  dynamic_color: ^1.7.0
  shared_preferences: ^2.3.0
  reorderable_grid_view: ^2.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
