name: plugin_toolbox_workspace

packages:
  - app
  - packages/*

command:
  version:
    linkToCommits: true
    workspaceChangelog: true

scripts:
  analyze:
    run: dart analyze
    description: 运行全仓静态代码分析

  format:
    run: dart format app packages/core packages/lua packages/dui packages/ui tool
    description: 代码风格统一格式化

  format:check:
    run: dart format --output=none --set-exit-if-changed app packages/core packages/lua packages/dui packages/ui tool
    description: 校验格式化是否符合门禁标准 (CI Format Gate)

  verify:
    run: dart run tool/verify.dart
    description: 运行独立架构规范与自动化逻辑校验套件

  test:
    run: melos exec --dir-exists="test" -- "flutter test"
    description: 运行各包单元测试与组件测试

  test:coverage:
    run: dart run tool/coverage.dart
    description: 自动化运行各包测试并汇总生成全仓 coverage/lcov.info

  pack:plugins:
    run: python sample_plugins/pack.py
    description: 批量打包示例动态插件为 .ptx 归档文件

  build:apk:
    run: cd app && flutter build apk --split-per-abi
    description: 构建 Android 发布版 APK 安装包
