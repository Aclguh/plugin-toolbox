name: plugin_toolbox_workspace
repository: https://github.com/user/plugin-toolbox

packages:
  - app
  - packages/*

command:
  bootstrap:
    usePubspecOverrides: true

scripts:
  analyze:
    exec: dart analyze --fatal-infos
    description: 静态分析
    packageFilters:
      dirExists: lib

  test:
    exec: flutter test
    description: 运行测试
    packageFilters:
      dirExists: test

  format:
    exec: dart format .
    description: 格式化

  build_runner:
    exec: dart run build_runner build --delete-conflicting-outputs
    description: 代码生成
    packageFilters:
      dependsOn: build_runner

  verify:
    run: dart run tool/verify.dart
    description: 运行独立规范与逻辑自动化验证套件 (须在仓库根目录)

  pack:plugins:
    run: python sample_plugins/pack.py
    description: 打包全部示例动态插件为 .ptx

  build:apk:
    run: cd app && flutter build apk --release --split-per-abi
    description: 按架构拆分构建发布 APK
