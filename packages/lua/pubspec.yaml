name: plugin_toolbox_lua
description: PluginToolbox Lua 脚本运行时引擎与安全宿主 API 绑定。
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_toolbox_core:
    path: ../core
  # 本地维护分支 (packages/third_party/lua_dardo): 在 VM 执行循环中加入指令数预算,
  # 支撑宿主侧脚本执行上限防护; 上游 lua_dardo 0.0.5 未提供 debug hook 能力。
  lua_dardo:
    path: ../third_party/lua_dardo
  http: ^1.2.2
  crypto: ^3.0.5
  uuid: ^4.5.1
  intl: ^0.19.0
  logger: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
