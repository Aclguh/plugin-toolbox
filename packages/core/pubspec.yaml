name: plugin_toolbox_core
description: PluginToolbox 核心模型、插件系统、安装器与隔离服务。
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.5.0
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.0
  path_provider: ^2.1.0
  archive: ^3.6.1
  equatable: ^2.0.7
  logger: ^2.5.0
  # 插件商店的远端目录拉取与安装包下载（纯 Dart HTTP 客户端, 不引入 Flutter UI 依赖）
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
