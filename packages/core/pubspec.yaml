name: plugin_toolbox_core
description: PluginToolbox 核心模型、插件系统、安装器与隔离服务。
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.5.0

dependencies:
  archive: ^3.6.1
  equatable: ^2.0.7
  logger: ^2.5.0
  # 安装包下载后的 SHA-256 内容哈希校验 (防供应链篡改)
  crypto: ^3.0.5
  # 插件商店的远端目录拉取与安装包下载（纯 Dart HTTP 客户端, 不引入 Flutter UI 依赖）
  http: ^1.2.2

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
