name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  quality:
    name: analyze + verify + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true

      - name: Install melos
        run: dart pub global activate melos 6.0.0

      - name: Bootstrap workspace
        run: melos bootstrap

      - name: Format gate (dart format)
        # 显式列出受门禁约束的源码目录, 排除 packages/third_party (上游 fork 保持原貌)
        run: dart format --set-exit-if-changed app packages/core packages/lua packages/dui packages/ui tool

      - name: Static analysis (root)
        run: dart analyze

      - name: Static analysis (packages)
        run: melos run analyze

      - name: Spec & logic verification suite
        run: dart run tool/verify.dart

      - name: Unit & widget tests with coverage (all packages)
        run: melos run test:coverage

      - name: Coverage threshold gate check
        run: dart run tool/check_coverage.dart --min-coverage 70 --require-all

      - name: Debug APK build smoke (app)
        working-directory: app
        run: flutter build apk --debug
