name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  quality:
    name: analyze + verify + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true

      - name: Install melos
        run: dart pub global activate melos 6.0.0

      - name: Bootstrap workspace
        run: melos bootstrap

      - name: Static analysis (root)
        run: dart analyze

      - name: Static analysis (packages)
        run: melos run analyze

      - name: Spec & logic verification suite
        run: dart run tool/verify.dart

      - name: Unit & widget tests (all packages)
        run: melos run test
